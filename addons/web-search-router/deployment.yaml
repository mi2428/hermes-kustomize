apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
spec:
  template:
    spec:
      initContainers:
        - name: validate-search-router
          image: nousresearch/hermes-agent:v0.22.2@sha256:36099926da316742423544e055d4734777105ffe6341873af5459b957d0c2919
          command:
            - /opt/hermes/.venv/bin/python
            - -c
            - |
              import ddgs
              import os

              required = ("BRAVE_SEARCH_API_KEY", "TAVILY_API_KEY", "EXA_API_KEY", "FIRECRAWL_API_KEY", "PARALLEL_API_KEY")
              missing = [name for name in required if not os.getenv(name)]
              if missing:
                  raise SystemExit("Missing search keys: " + ", ".join(missing))
          envFrom:
            - secretRef:
                name: hermes-runtime
      containers:
        - name: hermes
          volumeMounts:
            - name: web-search-router
              mountPath: /opt/hermes/plugins/web/web_search_router
              readOnly: true
      volumes:
        - name: web-search-router
          configMap:
            name: hermes-web-search-router
