apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
spec:
  template:
    spec:
      initContainers:
        - name: validate-local-browser
          image: nousresearch/hermes-agent:v2026.9.24@sha256:fca358f12efd65bfaaca05884166f15c0e2788375ca30d77061ac1ebc96452b7
          command:
            - /bin/sh
            - -ec
            - command -v agent-browser >/dev/null && agent-browser --version >/dev/null
      containers:
        - name: hermes
          volumeMounts:
            - name: browser-shm
              mountPath: /dev/shm
      volumes:
        - name: browser-shm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
