apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
spec:
  template:
    spec:
      initContainers:
        - name: install-soul
          image: nousresearch/hermes-agent:v2026.9.24@sha256:fca358f12efd65bfaaca05884166f15c0e2788375ca30d77061ac1ebc96452b7
          command:
            - /bin/sh
            - -ec
            - |
              source=/soul/SOUL.md
              target=/opt/data/SOUL.md
              test -s "$source"
              test ! -L "$target"
              if ! cmp -s "$source" "$target"; then
                tmp=$(mktemp /opt/data/.SOUL.md.XXXXXXXX)
                trap 'rm -f "$tmp"' EXIT
                cp "$source" "$tmp"
                chmod 0644 "$tmp"
                chown 10000:10000 "$tmp"
                mv -f "$tmp" "$target"
              fi
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: soul
              mountPath: /soul
              readOnly: true
      volumes:
        - name: soul
          configMap:
            name: hermes-soul
